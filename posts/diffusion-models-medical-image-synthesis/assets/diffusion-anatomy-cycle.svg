<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual diffusion path from synthetic anatomy to noise and back</title>
  <desc id="desc">A non-clinical, procedural illustration showing a stylized anatomy-like ellipse gradually noised in the forward process, then denoised in the learned reverse process under conditioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="forward" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="reverse" x1="0" x2="1">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="noiseFine" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f8fafc"/>
      <circle cx="2" cy="2" r="1.6" fill="#64748b" opacity="0.35"/>
      <circle cx="9" cy="4" r="1.2" fill="#1d4ed8" opacity="0.24"/>
      <circle cx="5" cy="10" r="1.7" fill="#7c3aed" opacity="0.30"/>
      <circle cx="12" cy="11" r="1.1" fill="#0f172a" opacity="0.22"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="curveArrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto">
      <path d="M2,2 L20,9 L2,16 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#0f172a">Diffusion learns a denoising path, not a shortcut to clinical truth</text>
  <text x="600" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Synthetic/procedural shapes only — conceptual illustration, not patient imaging data</text>

  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#0f172a">
    <rect x="62" y="134" width="508" height="350" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="630" y="134" width="508" height="350" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <text x="316" y="174" text-anchor="middle" font-size="20" font-weight="800">Forward process q(x<tspan baseline-shift="sub">t</tspan>|x<tspan baseline-shift="sub">0</tspan>)</text>
    <text x="884" y="174" text-anchor="middle" font-size="20" font-weight="800">Learned reverse process p<tspan baseline-shift="sub">θ</tspan>(x<tspan baseline-shift="sub">t−1</tspan>|x<tspan baseline-shift="sub">t</tspan>, c)</text>
  </g>

  <g transform="translate(102 212)">
    <g id="anatomy0">
      <rect x="0" y="0" width="105" height="150" rx="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
      <ellipse cx="52" cy="78" rx="34" ry="49" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
      <path d="M52 28 C25 42 28 78 52 84 C76 78 79 42 52 28Z" fill="#fce7f3" stroke="#db2777" stroke-width="2" opacity="0.9"/>
      <path d="M52 84 C31 90 32 122 52 133 C72 122 73 90 52 84Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.95"/>
      <path d="M24 73 C39 69 65 69 81 73" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#075985">x₀</text>
      <text x="52" y="201" text-anchor="middle" font-family="Inter, Arial" font-size="11" fill="#475569">
        <tspan x="52">structured</tspan><tspan x="52" dy="13">anatomy-like signal</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(250 212)" opacity="0.85">
    <rect x="0" y="0" width="105" height="150" rx="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <ellipse cx="52" cy="78" rx="34" ry="49" fill="#c7d2fe" stroke="#4338ca" stroke-width="3"/>
    <path d="M52 30 C26 45 31 75 51 84 C74 80 79 43 52 30Z" fill="#fce7f3" stroke="#db2777" stroke-width="2" opacity="0.62"/>
    <path d="M52 84 C33 92 35 120 52 132 C70 120 73 92 52 84Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.65"/>
    <rect x="0" y="0" width="105" height="150" rx="20" fill="url(#noiseFine)" opacity="0.28"/>
    <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#4338ca">xₜ</text>
    <text x="52" y="201" text-anchor="middle" font-family="Inter, Arial" font-size="11" fill="#475569">
      <tspan x="52">signal + Gaussian</tspan><tspan x="52" dy="13">noise</tspan>
    </text>
  </g>

  <g transform="translate(398 212)">
    <rect x="0" y="0" width="105" height="150" rx="20" fill="url(#noiseFine)" stroke="#7e22ce" stroke-width="2"/>
    <ellipse cx="52" cy="78" rx="34" ry="49" fill="#c4b5fd" stroke="#7e22ce" stroke-width="3" opacity="0.20"/>
    <path d="M18 40 L86 121 M22 120 L88 31 M18 78 L90 78" stroke="#64748b" stroke-width="3" opacity="0.25"/>
    <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#7e22ce">xₜ≈ε</text>
    <text x="52" y="201" text-anchor="middle" font-family="Inter, Arial" font-size="11" fill="#475569">
      <tspan x="52">almost pure</tspan><tspan x="52" dy="13">noise</tspan>
    </text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.75">
    <path d="M214 284 C228 284 232 284 246 284"/>
    <path d="M362 284 C376 284 380 284 394 284"/>
  </g>

  <path d="M108 442 C210 466 374 466 490 442" fill="none" stroke="url(#forward)" stroke-width="8" stroke-linecap="round" marker-end="url(#curveArrow)"/>
  <text x="300" y="476" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#334155">Known corruption: add calibrated noise over timesteps</text>

  <g transform="translate(690 212)">
    <rect x="0" y="0" width="105" height="150" rx="20" fill="url(#noiseFine)" stroke="#7e22ce" stroke-width="2"/>
    <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#7e22ce">noise</text>
  </g>
  <g transform="translate(838 212)" opacity="0.9">
    <rect x="0" y="0" width="105" height="150" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <ellipse cx="52" cy="78" rx="34" ry="49" fill="#c7d2fe" stroke="#4338ca" stroke-width="3" opacity="0.55"/>
    <path d="M52 33 C27 46 33 76 52 83 C73 78 78 45 52 33Z" fill="#fce7f3" stroke="#db2777" stroke-width="2" opacity="0.50"/>
    <path d="M52 84 C34 94 36 120 52 131 C69 119 71 94 52 84Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.58"/>
    <rect x="0" y="0" width="105" height="150" rx="20" fill="url(#noiseFine)" opacity="0.20"/>
    <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#4338ca">denoise</text>
  </g>
  <g transform="translate(986 212)">
    <rect x="0" y="0" width="105" height="150" rx="20" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <ellipse cx="52" cy="78" rx="34" ry="49" fill="#bbf7d0" stroke="#059669" stroke-width="3"/>
    <path d="M52 28 C25 42 28 78 52 84 C76 78 79 42 52 28Z" fill="#fde68a" stroke="#d97706" stroke-width="2" opacity="0.86"/>
    <path d="M52 84 C31 90 32 122 52 133 C72 122 73 90 52 84Z" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
    <path d="M24 73 C39 69 65 69 81 73" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <text x="52" y="184" text-anchor="middle" font-family="Inter, Arial" font-weight="700" fill="#047857">sample</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.75">
    <path d="M802 284 C816 284 820 284 834 284"/>
    <path d="M950 284 C964 284 968 284 982 284"/>
  </g>
  <path d="M706 422 C808 454 972 454 1088 422" fill="none" stroke="url(#reverse)" stroke-width="8" stroke-linecap="round" marker-end="url(#curveArrow)"/>
  <text x="897" y="468" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#334155">Learned denoising: estimate noise/score, optionally guided by condition c</text>

  <g transform="translate(735 508)">
    <rect x="0" y="0" width="330" height="70" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="18" y="28" font-family="Inter, Arial" font-size="14" font-weight="800" fill="#0f172a">Conditioning c can encode</text>
    <text x="18" y="51" font-family="Inter, Arial" font-size="14" fill="#475569">modality, anatomy mask, covariates, text label, or acquisition context</text>
  </g>
  <g transform="translate(72 508)">
    <rect x="0" y="0" width="455" height="70" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="18" y="28" font-family="Inter, Arial" font-size="14" font-weight="800" fill="#9a3412">Medical caveat</text>
    <text x="18" y="51" font-family="Inter, Arial" font-size="14" fill="#7c2d12">A plausible sample is a research artifact until anatomy, utility, and privacy are evaluated.</text>
  </g>
</svg>
